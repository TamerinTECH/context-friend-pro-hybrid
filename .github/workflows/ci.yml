name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Privacy core and notes pipeline (JVM unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch the pinned sherpa-onnx archive (hash-checked)
        run: python3 tools/fetch_ci_deps.py

      - name: Unit tests (no Firebase keys, no models, synthetic data only)
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
